name: shoof_web_ui
description: Shared UI components for Shoof web applications (Admin, Insights)
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_hooks: ">=0.20.5 <1.0.0"
  hooks_riverpod: ">=2.4.9 <3.0.0"
  another_flushbar: ^1.12.30
  cloud_firestore: ^5.5.0
  fl_chart: ^0.69.0
  supabase_flutter: ">=2.3.0 <3.0.0"
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^3.0.2

dev_dependencies:
  flutter_lints: ^3.0.1

flutter:
  fonts:
    - family: NeoSans
      fonts:
        - asset: fonts/Neo Sans Arabic Regular.ttf
        - asset: fonts/NeoSansArabicLight.ttf
          weight: 300
        - asset: fonts/NeoSansArabicMedium.ttf
          weight: 500
        - asset: fonts/NeoSansArabicBold.ttf
          weight: 700
        - asset: fonts/NeoSansArabicBlack.ttf
          weight: 900

